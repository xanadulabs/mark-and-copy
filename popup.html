<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mark and Copy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Mark and Copy</h1>
    <p id="status" aria-live="polite">Click a tool.</p>
  </header>
  <button type="button" id="highlighter" aria-pressed="false">Highlighter</button>
  <button type="button" id="bingo" aria-pressed="false">Bingo</button>
  <button type="button" id="score" hidden>Place score</button>
  <button type="button" id="copy" hidden>Copy</button>
  <button type="button" id="close">Close</button>
  <script src="popup.js"></script>
</body>
</html>
